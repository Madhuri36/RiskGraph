services:

  # ============================================================
  # 1. Apache Kafka
  # ============================================================
  kafka:
    image: apache/kafka:3.8.1
    container_name: riskgraph-kafka

    ports:
      - "9092:9092"
      - "29092:29092"
      - "9093:9093"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

    volumes:
      - kafka_data:/var/lib/kafka/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"
        ]
      interval: 10s
      timeout: 10s
      retries: 12


  # ============================================================
  # 2. RustFS
  # ============================================================
  rustfs:
    image: rustfs/rustfs:latest
    container_name: riskgraph-rustfs

    command:
      - /data

    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"

      RUSTFS_ACCESS_KEY: riskgraph
      RUSTFS_SECRET_KEY: riskgraph_local_password

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - rustfs_data:/data


  # ============================================================
  # 3. Spark Master
  # ============================================================
  spark-master:
    image: apache/spark:3.5.7-python3
    container_name: riskgraph-spark-master

    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master

    environment:
      SPARK_NO_DAEMONIZE: "true"

    ports:
      # Spark master
      - "7077:7077"

      # Spark master web UI
      - "8081:8080"

      # Spark application / driver UI
      - "4040:4040"

    volumes:
      - .:/opt/spark/work-dir


  # ============================================================
  # 4. Spark Worker
  # ============================================================
  spark-worker:
    image: apache/spark:3.5.7-python3

    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077

    depends_on:
      - spark-master

    environment:
      SPARK_NO_DAEMONIZE: "true"

      # Conservative for an 8 GB RAM laptop
      SPARK_WORKER_MEMORY: 2G
      SPARK_WORKER_CORES: 3

    volumes:
      - .:/opt/spark/work-dir


  # ============================================================
  # 5. FastAPI
  # ============================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: riskgraph-api

    command:
      - uvicorn
      - app.api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload

    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      MINIO_ENDPOINT: rustfs:9000
      MINIO_ACCESS_KEY: riskgraph
      MINIO_SECRET_KEY: riskgraph_local_password
      MINIO_BUCKET: riskgraph

    ports:
      - "8000:8000"

    volumes:
      - .:/workspace

    depends_on:
      kafka:
        condition: service_healthy

      rustfs:
        condition: service_started


  # ============================================================
  # 6. Streamlit Dashboard
  # ============================================================
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: riskgraph-dashboard

    command:
      - streamlit
      - run
      - app/dashboard/Home.py
      - --server.address
      - 0.0.0.0
      - --server.port
      - "8501"

    environment:
      API_URL: http://api:8000

    ports:
      - "8501:8501"

    volumes:
      - .:/workspace

    depends_on:
      - api


# ============================================================
# Persistent Docker volumes
# ============================================================
volumes:
  kafka_data:
  rustfs_data: